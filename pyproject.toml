[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "experience-routing"
version = "0.1.0"
description = "Receiver-aware experience routing in robot policy populations (MVP)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
    "POT>=0.9",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The RL backbone (SAC) uses PyTorch. Install the CPU wheel:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
rl = ["torch>=2.0"]
# Real Meta-World environment (heavy; optional drop-in swap for the synthetic env).
# Current Farama Meta-World ships the V3 suite; the adapter also accepts V2.
metaworld = ["metaworld", "mujoco>=2.3", "gymnasium>=0.29"]
# Experiment logging (PLAN.md section 21). Runs also always log locally (JSONL).
logging = ["wandb>=0.16"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
